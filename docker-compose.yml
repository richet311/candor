services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clearfund
      POSTGRES_PASSWORD: clearfund_dev_only
      POSTGRES_DB: clearfund
    ports:
      - "5432:5432"
    volumes:
      - clearfund_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearfund -d clearfund"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clearfund_pgdata:
