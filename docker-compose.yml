services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: candor
      POSTGRES_PASSWORD: candor_dev_only
      POSTGRES_DB: candor
    ports:
      - "5433:5432"
    volumes:
      - candor_pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U candor -d candor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  candor_pgdata:
