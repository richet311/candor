services:
  - type: web
    name: candor-api
    runtime: node
    plan: free
    rootDir: server
    # --include=dev: NODE_ENV=production below makes plain `npm install` skip
    # devDependencies, but typescript and prisma (both dev deps) are needed to build.
    buildCommand: npm install --include=dev && npm run prisma:generate && npm run build
    startCommand: npm run prisma:deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render assigns this at service creation; the GitHub OAuth redirect_uri is built
      # from it (authService.ts), so GitHub login redirects to localhost without it.
      - key: API_ORIGIN
        value: https://candor-api.onrender.com
      # Point this at a Neon (neon.tech) connection string rather than Render's own
      # free Postgres: Render's free databases expire after 30 days and get deleted,
      # Neon's free tier doesn't expire. Use the "pooled connection" string from Neon.
      - key: DATABASE_URL
        sync: false
      # Neon's "Direct connection" string (not pooled) - required for prisma migrate deploy,
      # which needs a session-scoped advisory lock the pooled connection can't hold. See
      # schema.prisma. Using the pooled string here too causes a P1002 lock-timeout on deploy.
      - key: DIRECT_URL
        sync: false
      # Set this to the deployed client URL once you know it (e.g. your Cloudflare
      # Pages domain), then redeploy. CORS and the OAuth redirect both depend on it.
      - key: CLIENT_ORIGIN
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Fill in from dashboard.stripe.com/test/apikeys and your webhook endpoint's
      # signing secret. Required even in test mode, nothing here touches real money.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Optional sign-in providers. Leave unset and the app runs fine on
      # email/password alone, GET /api/auth/oauth/providers reports what's configured.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # Optional. Without it, verification/receipt emails are logged instead of sent.
      - key: RESEND_API_KEY
        sync: false
      # Object storage for uploaded avatars/org logos (Cloudflare R2, S3-compatible).
      # Required in production - config/env.ts refuses to boot without these once
      # NODE_ENV=production, since local disk doesn't survive a restart on Render.
      # dash.cloudflare.com > R2 > create a bucket > enable public access ("r2.dev"
      # subdomain is fine for this) > Manage API tokens > create an S3-compatible token.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
